{% extends 'base.html' %}

{% block title %}Password Reset Complete – CivicConnect{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card card-civic-flat p-5 border-0 shadow-sm">
        <i class="bi bi-shield-check text-success display-4 mb-3"></i>
        <h3 class="fw-bold text-dark">Password Successfully Reset</h3>
        <p class="text-muted mb-4">
          Your new password has been set. You can now proceed to log in with your updated credentials.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-civic-teal">Log In Now</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
