{% extends 'base.html' %}

{% block title %}Reset Password – CivicConnect{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card card-civic-flat p-4 p-md-5 border-0 shadow-sm">
        <h3 class="fw-bold text-dark mb-1">Reset Password</h3>
        <p class="text-muted small mb-4">Enter your registered email address and we'll send instructions to reset your password.</p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
          </div>

          <button type="submit" class="btn btn-civic-teal w-100 fw-semibold">Send Password Reset Link</button>
        </form>

        <div class="text-center pt-3 mt-3 border-top small text-muted">
          Remembered your password? <a href="{% url 'accounts:login' %}" class="text-teal">Back to login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
