{% extends 'base.html' %}

{% block title %}Delete Solution – CivicConnect{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card card-civic-flat p-4 p-md-5 border-0 shadow-sm">
        <i class="bi bi-trash3-fill text-danger display-4 mb-3"></i>
        <h3 class="fw-bold text-dark mb-2">Delete Proposed Solution?</h3>
        <p class="text-secondary mb-4">
          Are you sure you want to permanently delete the solution <strong>"{{ solution.title }}"</strong>?
          This action cannot be undone.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'solutions:detail' solution.pk %}" class="btn btn-light border px-4">Cancel</a>
            <button type="submit" class="btn btn-danger px-4 fw-semibold">Confirm Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
